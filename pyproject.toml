[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    ".venv313-win",
    "venv",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "W291",
    "W292",
    "W293",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"app/main.py" = ["E402"]
